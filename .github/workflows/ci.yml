name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.10.4

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      - run: npm test
